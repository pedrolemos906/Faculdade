<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Combustível</title>
</head>
<body>

    <h1>Qual combustível compensa?</h1>

    <form action="calcular.php" method="POST">
        <div>
            <label for="gasolina">Preço da Gasolina (R$):</label>
            <input type="number" id="gasolina" name="gasolina" step="0.01" required>
        </div>

        <br>

        <div>
            <label for="alcool">Preço do Álcool (R$):</label>
            <input type="number" id="alcool" name="alcool" step="0.01" required>
        </div>

        <br>

        <button type="submit">Calcular</button>
    </form>

</body>
</html>
